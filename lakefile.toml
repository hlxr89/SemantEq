name = "StaticEval"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["StaticEval", "static_eval"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.30.0-rc1"

[[lean_lib]]
name = "StaticEval"

[[lean_exe]]
name = "static_eval"
root = "Main"
supportInterpreter = true
